<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Estadísticas</title>
        <link rel="stylesheet" href="/static/css/style.css">
        
    <script src="https://code.highcharts.com/highcharts.js"></script>

    </head>
    <body>
        
    <h1>Estadísticas</h1>
    
    <div class="chart-container">
        <h2>Cantidad de actividades por día:</h2>
        <div id="chart1" class="chart-div">
            <div class="loading">Cargando gráfico...</div>
        </div>
    </div>

    <div class="chart-container">
        <h2>Total de actividades por tipo:</h2>
        <div id="chart2" class="chart-div">
            <div class="loading">Cargando gráfico...</div>
        </div>
    </div>

    <div class="chart-container">
        <h2>Distribución de las actividades mensuales según momento del día:</h2>
        <div id="chart3" class="chart-div">
            <div class="loading">Cargando gráfico...</div>
        </div>
    </div>

    <div style="text-align: center;">
        <a href="/" class="btn-volver">Volver al inicio</a>
    </div>

        
    <script src="/static/js/estadisticas.js" defer></script>

    </body>
</html>
